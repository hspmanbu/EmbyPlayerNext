name: Android Build & Release

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Prepare Release Asset & Tag
        id: prepare
        shell: bash
        run: |
          VERSION_NAME=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts)
          VERSION_CODE=$(grep -oP 'versionCode\s*=\s*\K\d+' app/build.gradle.kts)
          
          # User-friendly APK filename
          APK_FILE="EmbyPlayerNext-v${VERSION_NAME}-debug.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$APK_FILE"
          
          TAG_NAME="v${VERSION_NAME}"
          # If tag already exists on remote, append run number so each push gets its own release
          if git ls-remote --tags origin "refs/tags/${TAG_NAME}" | grep -q "${TAG_NAME}"; then
            TAG_NAME="v${VERSION_NAME}-b${GITHUB_RUN_NUMBER}"
          fi
          
          echo "tag_name=$TAG_NAME" >> $GITHUB_ENV
          echo "version_name=$VERSION_NAME" >> $GITHUB_ENV
          echo "version_code=$VERSION_CODE" >> $GITHUB_ENV
          echo "apk_file=$APK_FILE" >> $GITHUB_ENV
          
          echo "Prepared $APK_FILE with tag $TAG_NAME"

      - name: Upload Debug APK to Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.tag_name }}-debug
          path: ${{ env.apk_file }}
          if-no-files-found: ignore
          retention-days: 14

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.tag_name }}
          name: "EmbyPlayerNext ${{ env.tag_name }} (Build ${{ env.version_code }})"
          body: |
            ### 🚀 EmbyPlayerNext ${{ env.tag_name }} 更新日志

            - **版本 (Version)**: v${{ env.version_name }} (Build ${{ env.version_code }})
            - **构建类型 (Type)**: Debug APK
            - **安装包文件名**: `${{ env.apk_file }}`
            - **适用设备**: Android 手机 / 平板 / Android TV 电视盒子 / 车机全平台自适应

            ---

            ### 📋 首个 Release 以来全部功能改进与优化汇总

            #### 1. 播放倍速记忆与焦点自动锁定（本次新增）
            - **记忆播放倍速设置**：在【设置】->【播放与解码】中新增“记忆播放倍速”选项。开启后，每次切换视频或连播时自动套用上次选择的播放倍速，无需重复手动调节。
            - **倍速面板焦点自动选中**：打开播放器倍速调节面板时，遥控器选择框（焦点高亮边框与单选状态）自动精准聚焦在当前的播放倍速选项上，无需手动找寻当前倍速位置。

            #### 2. 首页“继续观看”焦点边界与样式优化（本次新增）
            - **焦点框左边缘完整显示**：彻底修复首页“继续观看”横向队列中，首个剧集卡片在被框选（遥控器焦点放大）时高亮外边框左边线被外层滚动容器边缘裁剪挤出界面的问题。
            - **全端自适应内边距**：优化了各横向列表的滚动与放大安全边距（PaddingValues），确保在高缩放与大屏下边框与圆角阴影均完整展现。

            #### 3. 多服务器与多账号无缝保存与独立隔离
            - **支持多服务器登录与持久化**：支持同时保存多个 Emby 服务器与不同用户账号，应用启动时默认自动连接上一次使用的服务器与账号。
            - **配置隔离与覆盖修复**：修复了保存新服务器时偶发覆盖旧服务器配置的逻辑缺陷，每个服务器拥有独立的 Token、端口检测配置及安全证书策略。
            - **切换时完整状态清空**：服务器切换时彻底清除上一服务器的内存缓存、首页继续观看、媒体库分类及播放列表，防止跨服务器内容混淆或串台。
            - **首页快捷切换入口**：在首页顶部栏集成直观的服务器切换按钮，方便在大屏与移动端一键秒级切换不同媒体服务器。

            #### 4. 网络传输稳定性与 OkHttp 连接优化
            - **流异常中断彻底修复**：恢复 OkHttp 异常重试策略（`retryOnConnectionFailure(true)`），针对国内动态宽带、NAT 映射波动及移动端休眠唤醒网络状况优化连接池（8 个长连接，30 秒空闲回收），彻底解决全页面偶发 `unexpected end of stream on xxx` 报错。
            - **移除不合理请求超时**：取消全局 callTimeout 限制，确保高码率大片、长视频媒体流及高延迟远程服务器请求不被意外中断。

            #### 5. 首页“继续观看”剧集聚合与短时间播放留存
            - **剧集整剧聚合显示**：首页“继续观看”中的剧集不再展示零散单集，而是以整部剧集卡片形式聚合呈现，点击后直接精准跳转到当前有播放进度的集数详情页。
            - **秒级短播进度留存**：针对仅播放十几秒便退出的视频，即使尚未达到服务端常规进度打点阈值，也能精准捕获并保留在继续播放列表，支持快速断点续播。

            #### 6. 动态端口自动解析与毫秒级故障切换
            - **连接超时精准生效**：重构动态端口检测与握手计时器，解决原本设置 5 秒超时但实际等待过久才切换端口的问题。
            - **智能双栈并发探测**：支持从自定义 HTTP 接口实时解析最新动态端口并实现热更新无感重连。

            #### 7. 剧集详情页选集智能居中定位
            - **附近集数优先展示**：剧集详情页底部的“更多来自”展示逻辑优化，由从第 1 集开始展示改为自动以当前页面集数为中心智能定位，优先呈现前后相邻集数，方便快速追剧选集。

            #### 8. 4K HEVC 硬件解码看门狗防假死与剧集自动连播
            - **播放看门狗防误触**：针对 4K HEVC / 高码率片源加载初期偶发的假卡死误报问题，重构了帧渲染监控看门狗，彻底解决“弹窗提示播放失败但实际随后能正常播放”的偶发误报。
            - **剧集自动连播**：单集播放完毕后自动进入 5 秒倒计时并无缝跳转下一集，支持遥控器一键跳过或取消倒计时。

            #### 9. Android TV 大屏交互与触屏全平台适配
            - **TV 边缘平滑滚动（tvScrollThenFocus）**：解决 Compose 列表在大屏遥控器下按键过快导致的焦点丢失或跳出视口问题，实现丝滑焦点追踪与滚动。
            - **自适应响应式布局**：完美兼容电视大屏横屏遥控器、平板分栏展开与手机单手竖屏触控。
            - **全方位解码与缓存控制**：支持自适应硬件加速解码、软解回退与本地磁盘大容量流缓存设置。
          files: ${{ env.apk_file }}
          generate_release_notes: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
