name: Android Build & Release

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Prepare Release Asset & Tag
        id: prepare
        shell: bash
        run: |
          VERSION_NAME=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts)
          VERSION_CODE=$(grep -oP 'versionCode\s*=\s*\K\d+' app/build.gradle.kts)
          
          # User-friendly APK filename
          APK_FILE="EmbyPlayerNext-v${VERSION_NAME}-debug.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$APK_FILE"
          
          TAG_NAME="v${VERSION_NAME}"
          # If tag already exists on remote, append run number so each push gets its own release
          if git ls-remote --tags origin "refs/tags/${TAG_NAME}" | grep -q "${TAG_NAME}"; then
            TAG_NAME="v${VERSION_NAME}-b${GITHUB_RUN_NUMBER}"
          fi
          
          echo "tag_name=$TAG_NAME" >> $GITHUB_ENV
          echo "version_name=$VERSION_NAME" >> $GITHUB_ENV
          echo "version_code=$VERSION_CODE" >> $GITHUB_ENV
          echo "apk_file=$APK_FILE" >> $GITHUB_ENV
          
          echo "Prepared $APK_FILE with tag $TAG_NAME"

      - name: Upload Debug APK to Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.tag_name }}-debug
          path: ${{ env.apk_file }}
          if-no-files-found: ignore
          retention-days: 14

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.tag_name }}
          name: "EmbyPlayerNext ${{ env.tag_name }} (Build ${{ env.version_code }})"
          body: |
            ### 🚀 EmbyPlayerNext ${{ env.tag_name }} 更新日志

            - **版本 (Version)**: v${{ env.version_name }} (Build ${{ env.version_code }})
            - **构建类型 (Type)**: Debug APK
            - **安装包文件名**: `${{ env.apk_file }}`
            - **适用设备**: Android 手机 / 平板 / Android TV 电视盒子 / 车机全平台自适应

            ---

            ### 🌟 本次更新内容（相比上一版改进）

            #### 1. 网络传输与并发吞吐量深度优化（大幅提升加载网速）
            - **高并发解除限流瓶颈**：解除 OkHttp 默认单主机仅允许 5 个并发请求的排队瓶颈，将单主机并发提高至 32、全局并发提高至 128，海报墙瀑布流与媒体元数据批量请求不再堵塞排队。
            - **独立分级连接池与长连接保活**：引入 API（60s）、媒体流（120s）与海报图片（60s）专属长连接池，长久复用 HTTP/2 与 TCP 连接，大幅降低反复握手与 TLS 协商延迟。
            - **FastDns 智能解析与 IPv6 防黑洞**：实现带 10 分钟 TTL 内存缓存的 FastDns，消除频繁 DNS 查询耗时；默认开启“IPv4 优先解析”，针对电视盒子与国内宽带 IPv6 连通异常或黑洞，彻底根治 5~10 秒超时挂起卡死。
            - **Coil 全局图片引擎接入与多级缓存**：构建全局统一图片加载器，复用 FastDns、高并发连接池与自签名 HTTPS 信任；新增 150MB 本地磁盘持久缓存与 25% 内存缓存，海报二次浏览 0 网络请求秒开；低配置电视机顶盒自动降级 RGB_565 解码防内存抖动。

            #### 2. 视频播放秒开、快退零耗时与弱网自适应优化
            - **常规网络起播秒开**：起播缓冲门限从 1000ms 降至 500ms，正常网络下点击即可瞬时出画面。
            - **30秒回退缓存（遥控器倒退零网络耗时）**：开启 ExoPlayer 30 秒 BackBuffer 机制，遥控器快退 5~30 秒直接读取内存已播帧，免除向服务器发起 HTTP Range 请求，实现 0 秒瞬移。
            - **重缓冲防频繁卡顿**：将重缓冲恢复门限提升至 4000ms，在网络波动断流后积攒充足数据再恢复播放，打破“卡 1 秒-播 1 秒-又卡顿”的恶性循环。
            - **新增“弱网深度缓冲模式”设置**：在【设置 -> 网络与兼容性】新增独立开关。开启后预读缓冲扩展至 120 秒、重缓冲提升至 6 秒，用大缓冲平滑恶劣网络的大幅抖动。
            - **流媒体指数退避容错与动态带宽估算**：配置 `DefaultLoadErrorHandlingPolicy` 与 `DefaultBandwidthMeter`，流媒体遇到瞬时丢包或超时自动指数退避重试，杜绝脆弱网络下过早弹出错误中断。

            ---

            ### 📋 首个 Release 以来核心功能汇总

            - **播放倍速记忆与焦点自动锁定**：支持在设置中开启“记忆播放倍速”，每次播放自动套用；调节倍速时焦点框自动精准聚焦当前倍速。
            - **首页继续观看剧集聚合与短播留存**：继续观看以整部剧集聚合展示，点击精准跳转有播放进度的单集；支持十几秒短播进度留存。
            - **4K HEVC 硬件解码看门狗防假死**：重构帧渲染监控看门狗，避免高码率视频加载初期偶发卡顿误报播放失败弹窗。
            - **剧集自动连播**：单集播放完毕后自动进入 5 秒倒计时并无缝跳转下一集，支持一键跳过。
            - **全平台自适应交互**：完美兼容电视大屏横屏遥控器、平板分栏展开与手机单手竖屏触控；支持平滑遥控器滚动与焦点防丢失。
            - **网络传输稳定性与连接池优化**：针对动态宽带与休眠唤醒网络状况优化连接池，彻底消除偶发断流异常。
          files: ${{ env.apk_file }}
          generate_release_notes: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
