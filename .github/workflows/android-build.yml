name: Android Build & Release

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Prepare Release Asset & Tag
        id: prepare
        shell: bash
        run: |
          VERSION_NAME=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts)
          VERSION_CODE=$(grep -oP 'versionCode\s*=\s*\K\d+' app/build.gradle.kts)
          
          # User-friendly APK filename
          APK_FILE="EmbyPlayerNext-v${VERSION_NAME}-debug.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$APK_FILE"
          
          TAG_NAME="v${VERSION_NAME}"
          # If tag already exists on remote, append run number so each push gets its own release
          if git ls-remote --tags origin "refs/tags/${TAG_NAME}" | grep -q "${TAG_NAME}"; then
            TAG_NAME="v${VERSION_NAME}-b${GITHUB_RUN_NUMBER}"
          fi
          
          echo "tag_name=$TAG_NAME" >> $GITHUB_ENV
          echo "version_name=$VERSION_NAME" >> $GITHUB_ENV
          echo "version_code=$VERSION_CODE" >> $GITHUB_ENV
          echo "apk_file=$APK_FILE" >> $GITHUB_ENV
          
          echo "Prepared $APK_FILE with tag $TAG_NAME"

      - name: Upload Debug APK to Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.tag_name }}-debug
          path: ${{ env.apk_file }}
          if-no-files-found: ignore
          retention-days: 14

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.tag_name }}
          name: "EmbyPlayerNext ${{ env.tag_name }} (Build ${{ env.version_code }})"
          body: |
            ### EmbyPlayerNext ${{ env.tag_name }}
            - **版本 (Version)**: ${{ env.version_name }} (Build ${{ env.version_code }})
            - **构建类型 (Type)**: Debug APK
            - **文件名 (File)**: `${{ env.apk_file }}`
            
            > 本安装包由 GitHub Actions CI 自动编译并发布。
          files: ${{ env.apk_file }}
          generate_release_notes: true
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
