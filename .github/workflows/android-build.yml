name: Android Build

on:
  workflow_dispatch:
  push:
    branches: [ main, "feature/**" ]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew assembleRelease assembleDebug --no-daemon --stacktrace

      - name: Upload Release APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: EmbyPlayerNext-v2.3.27-release
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload Debug APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: EmbyPlayerNext-v2.3.27-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: ignore
          retention-days: 14
