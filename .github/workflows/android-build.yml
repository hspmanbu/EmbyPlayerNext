name: Android Build & Release

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Prepare Release Asset & Tag
        id: prepare
        shell: bash
        run: |
          VERSION_NAME=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts)
          VERSION_CODE=$(grep -oP 'versionCode\s*=\s*\K\d+' app/build.gradle.kts)
          
          # User-friendly APK filename
          APK_FILE="EmbyPlayerNext-v${VERSION_NAME}-debug.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$APK_FILE"
          
          TAG_NAME="v${VERSION_NAME}"
          # If tag already exists on remote, append run number so each push gets its own release
          if git ls-remote --tags origin "refs/tags/${TAG_NAME}" | grep -q "${TAG_NAME}"; then
            TAG_NAME="v${VERSION_NAME}-b${GITHUB_RUN_NUMBER}"
          fi
          
          echo "tag_name=$TAG_NAME" >> $GITHUB_ENV
          echo "version_name=$VERSION_NAME" >> $GITHUB_ENV
          echo "version_code=$VERSION_CODE" >> $GITHUB_ENV
          echo "apk_file=$APK_FILE" >> $GITHUB_ENV
          
          echo "Prepared $APK_FILE with tag $TAG_NAME"

      - name: Upload Debug APK to Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.tag_name }}-debug
          path: ${{ env.apk_file }}
          if-no-files-found: ignore
          retention-days: 14

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.tag_name }}
          name: "EmbyPlayerNext ${{ env.tag_name }} (Build ${{ env.version_code }})"
          body: |
            ### 🚀 EmbyPlayerNext ${{ env.tag_name }} 更新日志

            - **版本 (Version)**: v${{ env.version_name }} (Build ${{ env.version_code }})
            - **构建类型 (Type)**: Debug APK
            - **安装包文件名**: `${{ env.apk_file }}`
            - **适用设备**: Android 手机 / 平板 / Android TV 电视盒子 / 车机全平台自适应

            ---

            ### 🌟 本次更新内容（相比上一版改进）

            #### 1. 服务器与账号管理全面重构与显示优化
            - **彻底修复同服务器多账号丢失覆盖 BUG**：重构多账号配置存储与同步机制，严格隔离不同用户凭证与网络配置同步，彻底根治同服务器添加多账号后退出重进导致非活动账号被覆盖抹除的隐患。
            - **登录与账号弹窗响应全局 UI 缩放**：解决 Compose Dialog 独立 Window 未能继承全局 `LocalDensity` 的缩放缺失问题，现在弹窗及其内所有文字与控件均完美跟随设置中的“界面缩放”比例同步缩放。
            - **重新设计服务器与账号条目卡片排版**：去除每条条目中机械重复的“Emby Server”大标题，大字粗体突出展示关键用户名；服务器真实地址独立整行展示（等宽字体底色衬托），无论手机竖屏或横屏均完整清晰呈现、绝不截断挤压；右上角紧凑排列“切换”与“删除”按钮，点击卡片主体自动一键填入地址与用户名。

            #### 2. 全类型缓存上限可调、实时磁盘占用监控与手动分类清空
            - **新增独立【存储与缓存管理】设置专区**：将所有应用缓存与本地存储统一归纳，清晰直观。
            - **视频流媒体磁盘缓存（ExoPlayer）**：支持 0（关闭）至 2048 MB 磁盘上限调节；实时读取物理磁盘占用大小；支持独立手动一键清空。
            - **海报与图片磁盘缓存（Coil）**：新增 `imageCacheMb` 配置（支持 0 至 1024 MB 上限调节）；实时读取物理磁盘占用大小；支持独立手动一键清空。
            - **DNS 解析缓存（FastDns）**：实时展示当前内存中已缓存的域名解析记录条数；支持独立手动一键清空并重置解析。
            - **运行与诊断日志（DiagnosticsLogger）**：实时读取诊断日志文件物理大小；支持一键保存导出至下载目录，并支持手动清空。
            - **一键清空所有缓存**：提供一键式全量清理功能，实时刷新磁盘释放容量并给出即时提示。

            #### 3. 视频起播测速感知与实时动态网速展示
            - **测速采样窗口优化**：将播放器网速采样刷新周期由 1000ms 整秒均值缩短为 500ms 滑动窗口，消除起播初期短时高速拉流被稀释的迟滞感。
            - **起播缓冲菊花圈实时网速胶囊**：起播缓冲等待菊花圈内实时动态展示当前拉流下载网速（如 `缓冲中 · 15.2 MB/s`），等待过程给予用户即时反馈。

            ---

            ### 📋 首个 Release 以来核心功能汇总

            - **高并发解除限流与长连接保活**：解除 OkHttp 默认 5 并发瓶颈，提升至 32 单机/128 全局并发；构建 API、媒体流与图片专属长连接池，极大减少握手延迟。
            - **FastDns 智能解析与 IPv6 防黑洞**：默认优先解析 IPv4 并带内存 TTL 缓存，彻底根治电视机顶盒由于 IPv6 超时引起的 5~10 秒黑洞卡死。
            - **播放倍速记忆与焦点自动锁定**：支持在设置中开启“记忆播放倍速”，每次播放自动套用；调节倍速时焦点框自动精准聚焦当前倍速。
            - **首页继续观看剧集聚合与短播留存**：继续观看以整部剧集聚合展示，点击精准跳转有播放进度的单集；支持十几秒短播进度留存。
            - **4K HEVC 硬件解码看门狗防假死**：重构帧渲染监控看门狗，避免高码率视频加载初期偶发卡顿误报播放失败弹窗。
            - **剧集自动连播**：单集播放完毕后自动进入 5 秒倒计时并无缝跳转下一集，支持一键跳过。
            - **全平台自适应交互**：完美兼容电视大屏横屏遥控器、平板分栏展开与手机单手竖屏触控；支持平滑遥控器滚动与焦点防丢失。
            - **网络传输稳定性与连接池优化**：针对动态宽带与休眠唤醒网络状况优化连接池，彻底消除偶发断流异常。
          files: ${{ env.apk_file }}
          generate_release_notes: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
