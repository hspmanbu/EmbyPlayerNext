name: Android Build

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct source bundle
        shell: bash
        run: |
          cat .ci/source.part00 .ci/source.part01 .ci/source.part02 .ci/source.part03 .ci/source.part04 .ci/source.part05 .ci/source.part06 .ci/source.part07 .ci/source.part08 > source.b64
          base64 --decode source.b64 > source.zip
          test "$(stat -c%s source.zip)" = "44129"
          unzip -t source.zip
          unzip -o source.zip -d .
          rm -f source.b64 source.zip EmbyPlayerNext-source-ci.zip

      - name: Apply source fixes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("app/src/main/java/com/aistudio/embyplayer/ui/screens/PlayerScreen.kt")
          s = p.read_text()
          s = s.replace(
              "if(listener!=null) p.addListener(listener)",
              "if(listener!=null) p?.addListener(listener)"
          )
          s = s.replace(
              'Text(descriptor.item.name,Color.White,modifier=Modifier.weight(1f));Text("网速: $networkSpeed",color=Color.White,style=MaterialTheme.typography.bodySmall)',
              'Text(descriptor.item.name,color=Color.White,modifier=Modifier.weight(1f));Text("网速: $networkSpeed",color=Color.White,style=MaterialTheme.typography.bodySmall)'
          )
          p.write_text(s)
          PY

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Install Android SDK packages
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          "$SDKMANAGER" --version
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Build debug APK
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Upload debug APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: EmbyPlayerNext-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: ignore
          retention-days: 14
