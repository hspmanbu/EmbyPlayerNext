name: Android Build & Release

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Prepare Release Asset & Tag
        id: prepare
        shell: bash
        run: |
          VERSION_NAME=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts)
          VERSION_CODE=$(grep -oP 'versionCode\s*=\s*\K\d+' app/build.gradle.kts)
          
          # User-friendly APK filename
          APK_FILE="EmbyPlayerNext-v${VERSION_NAME}-debug.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$APK_FILE"
          
          TAG_NAME="v${VERSION_NAME}"
          # If tag already exists on remote, append run number so each push gets its own release
          if git ls-remote --tags origin "refs/tags/${TAG_NAME}" | grep -q "${TAG_NAME}"; then
            TAG_NAME="v${VERSION_NAME}-b${GITHUB_RUN_NUMBER}"
          fi
          
          echo "tag_name=$TAG_NAME" >> $GITHUB_ENV
          echo "version_name=$VERSION_NAME" >> $GITHUB_ENV
          echo "version_code=$VERSION_CODE" >> $GITHUB_ENV
          echo "apk_file=$APK_FILE" >> $GITHUB_ENV
          
          echo "Prepared $APK_FILE with tag $TAG_NAME"

      - name: Upload Debug APK to Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.tag_name }}-debug
          path: ${{ env.apk_file }}
          if-no-files-found: ignore
          retention-days: 14

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.tag_name }}
          name: "EmbyPlayerNext ${{ env.tag_name }} (Build ${{ env.version_code }})"
          body: |
            ### 🚀 EmbyPlayerNext ${{ env.tag_name }} 更新日志

            - **版本 (Version)**: v${{ env.version_name }} (Build ${{ env.version_code }})
            - **构建类型 (Type)**: Debug APK
            - **安装包文件名**: `${{ env.apk_file }}`
            - **适用设备**: Android 手机 / 平板 / Android TV 电视盒子 / 车机全平台自适应

            ---

            ### 🌟 本次更新内容（相比上一版改进）

            #### 1. 容器、文件夹及整部剧集删除通道恢复与高危防误删警示
            - **删除通道恢复**：恢复容器、文件夹/合集（Folder, CollectionFolder, BoxSet）以及整部剧集（Series）、整季（Season）的客户端删除能力，不再封死删除通道。
            - **高危级联删除警示**：对整部剧集、整季或文件夹展示针对性高危警示弹窗，明确提示将从服务端磁盘级联删除该目录下的所有季、单集视频及元数据文件，严格防范误操作。

            #### 2. 多服务器切换支持同服务器多账号登录
            - **同服务器多账号独立共存**：完善同一服务器地址下不同用户账号（多账号）的独立持久化存储与快速切换，账号之间配置相互独立隔离。
            - **一键填入已有服务器地址**：在登录与服务器管理弹窗中新增“填入地址”便捷按钮，一键带入已有服务器地址，无需重复输入复杂的长网址即可快速登录同服务器的其他账号。
            - **同服务器多账号配置自动联动**：同一服务器的任一账号拉取更新动态端口或修改 HTTPS 设置后，自动联动同步该服务器下的其余账号，防止账号切换后因旧端口失效断连。

            #### 3. 动态端口预配置与首次连接自动拉取最新端口
            - **未连接服务器前允许保存配置**：支持在首次使用、未连接任何服务器前直接进入“动态端口”页面配置并保存，且“立即拉取并测试”不再强制要求已配置服务器地址。
            - **登录弹窗快捷配置入口**：在登录管理弹窗右上角增加“动态端口”快捷配置入口，方便首次使用的用户提前配置。
            - **首次连接失败自动抓取最新端口**：新建服务器时，若输入的地址符合动态端口规则（匹配目标域名或已配置抓取服务），首次连接失败（如因端口未填或填错导致超时/无法连接）时**自动从配置接口抓取最新端口并自动重试连接**，无需预先获知正确端口也能首次一键连接成功。

            ---

            ### 📋 首个 Release 以来核心功能汇总

            - **播放倍速记忆与焦点自动锁定**：支持在设置中开启“记忆播放倍速”，每次播放自动套用；调节倍速时焦点框自动精准聚焦当前倍速。
            - **首页继续观看剧集聚合与短播留存**：继续观看以整部剧集聚合展示，点击精准跳转有播放进度的单集；支持十几秒短播进度留存。
            - **4K HEVC 硬件解码看门狗防假死**：重构帧渲染监控看门狗，避免高码率视频加载初期偶发卡顿误报播放失败弹窗。
            - **剧集自动连播**：单集播放完毕后自动进入 5 秒倒计时并无缝跳转下一集，支持一键跳过。
            - **全平台自适应交互**：完美兼容电视大屏横屏遥控器、平板分栏展开与手机单手竖屏触控；支持平滑遥控器滚动与焦点防丢失。
            - **网络传输稳定性与连接池优化**：针对动态宽带与休眠唤醒网络状况优化连接池，彻底消除偶发断流异常。
          files: ${{ env.apk_file }}
          generate_release_notes: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
